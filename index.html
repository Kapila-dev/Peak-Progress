'use strict';
const KEY='peak_progress_v2';
const LEGACY='pp_v36';
const DB='peak_progress_media';
const STORE='exercise_photos';
const APP_VERSION='2.23';
const starter=[

 ['ohp','Overhead Press','Barbell','Shoulders'],['dbohp','Dumbbell Shoulder Press','Dumbbells','Shoulders'],['machinepress','Machine Shoulder Press','Stack Machine','Shoulders'],['plateshoulder','Plate-Loaded Shoulder Press','Plate-Loaded Machine','Shoulders'],['latraise','Lateral Raise','Dumbbells','Shoulders'],['cablelatraise','Cable Lateral Raise','Cable','Shoulders'],['rearraise','Rear Delt Raise','Dumbbells','Shoulders'],['reversepec','Reverse Pec Deck','Stack Machine','Shoulders'],['upright','Upright Row','Barbell','Shoulders'],

 ['airsquat','Air Squat','Bodyweight','Legs'],['reverselunge','Reverse Lunge','Bodyweight','Legs'],['split_squat_bw','Bodyweight Split Squat','Bodyweight','Legs'],['glutebridge','Glute Bridge','Bodyweight','Legs'],['singlelegbridge','Single-Leg Glute Bridge','Bodyweight','Legs'],['singlelegcalf','Single-Leg Calf Raise','Bodyweight','Legs'],
 ['hangingraise','Hanging Leg Raise','Bodyweight','Core'],['situp','Sit-Up','Bodyweight','Core'],['crunch','Crunch','Bodyweight','Core'],['bird_dog','Bird Dog','Bodyweight','Core'],['superman','Superman','Bodyweight','Back'],['burpee','Burpee','Bodyweight','Legs']
].map(x=>({id:x[0],name:x[1],equipment:x[2],muscle:x[3],custom:false}));
const EQUIPMENT=['Dumbbells','EZ Bar','Stack Machine','Plate-Loaded Machine','Cable','Barbell','Plates','Bodyweight','Other'];
const MUSCLES=['Chest','Back','Shoulders','Traps','Triceps','Biceps','Forearms','Legs','Core','Other'];
const defaults=()=>({version:2,view:'log',sessions:[],active:null,exercises:starter.map(x=>({...x})),favoriteExerciseIds:[],settings:{unit:'lb',restSeconds:90,restAlert:'off',keepAwake:false},legacyMigrated:false,activeExerciseId:null});
let S=load(); let modal=null; let photoUrls={}; let photoPresence=new Map(); let ellipticalTimer=null; let yogaTimer=null; let restInterval=null; let quoteInterval=null; let quoteIndexes={strength:0,elliptical:0,yoga:0}; let wakeLock=null; let restAudioCtx=null;

function load(){try{return normalize({...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')})}catch(e){return defaults()}}
function normalize(s){s.sessions=Array.isArray(s.sessions)?s.sessions:[];s.exercises=Array.isArray(s.exercises)&&s.exercises.length?s.exercises:starter.map(x=>({...x}));for(const base of starter){let existing=s.exercises.find(e=>e.id===base.id);if(!existing)s.exercises.push({...base});else if(!existing.custom){existing.name=base.name;existing.equipment=base.equipment;existing.muscle=base.muscle}}for(const e of s.exercises){e.gym=String(e.gym||'');e.setupNote=String(e.setupNote||'')}if(s.active?.type==='strength'&&Array.isArray(s.active.exercises))for(const x of s.active.exercises){let base=s.exercises.find(e=>e.id===x.exerciseId);x.gym=String(x.gym||base?.gym||'');x.setupNote=String(x.setupNote||base?.setupNote||'');x.equipment=x.equipment||base?.equipment||'Other';x.muscle=x.muscle||base?.muscle||'Other'}s.favoriteExerciseIds=Array.isArray(s.favoriteExerciseIds)?s.favoriteExerciseIds.filter(id=>s.exercises.some(e=>e.id===id)):[];s.settings={...defaults().settings,...(s.settings||{})};s.settings.keepAwake=!!s.settings.keepAwake;return s}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function todayLabel(){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date())}
function dateTime(ts){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(ts))}
function fmtSec(n){n=Math.max(0,Math.floor(n||0));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function durationText(min){min=Number(min)||0;if(min<60)return `${min} min`;let h=Math.floor(min/60),m=min%60;return `${h}h${m?` ${m}m`:''}`}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function exById(id){return S.exercises.find(e=>e.id===id)}
function activeStrength(){return S.active?.type==='strength'?S.active:null}
function completedSets(ex){return (ex.sets||[]).filter(x=>x.done)}
function navTitle(){return ({strength:'Strength',elliptical:'Elliptical',yoga:'Yoga',history:'History',settings:'Settings'})[S.view]||'Peak Progress'}

 strength:['Set the weight. Finish the rep.','Control down. Drive up.','One clean set at a time.','Form first. Then add weight.','Build strength one clean rep at a time.'],
 elliptical:['Choose the pace. Hold it.','Finish the minute you are in.','Smooth stride. Steady pressure.','Find the rhythm. Hold the pace.','Breathe. Drive. Repeat.'],

function sectionQuote(type){let arr=QUOTES[type]||[],i=(quoteIndexes[type]||0)%Math.max(1,arr.length);return `<div class="sectionquote"><span id="sectionQuoteText">${esc(arr[i]||'')}</span></div>`}
function nextQuote(type){let arr=QUOTES[type]||[];if(!arr.length)return;quoteIndexes[type]=((quoteIndexes[type]||0)+1)%arr.length;let el=document.getElementById('sectionQuoteText');if(el)el.textContent=arr[quoteIndexes[type]]}
function startQuoteTicker(type){stopQuoteTicker();quoteInterval=setInterval(()=>nextQuote(type),24000)}
function stopQuoteTicker(){if(quoteInterval){clearInterval(quoteInterval);quoteInterval=null}}

function hasMeaningfulActive(a=S.active){if(!a)return false;if(a.type==='strength')return !!(a.exercises&&a.exercises.length);if(a.type==='elliptical')return !!(a.timerStartedAt||Number(a.timerAccum)>0||String(a.duration??'').trim()||String(a.resistance??'').trim()||String(a.distance??'').trim()||String(a.calories??'').trim()||String(a.notes??'').trim());if(a.type==='yoga')return !!(a.timerStartedAt||Number(a.timerAccum)>0||String(a.duration??'').trim()||String(a.name??'').trim()||String(a.notes??'').trim());return false}
function clearEmptyActive(){if(S.active&&!hasMeaningfulActive(S.active)){S.active=null;S.activeExerciseId=null;return true}return false}

async function migrateLegacy(){
 if(S.legacyMigrated)return;
 let raw=localStorage.getItem(LEGACY);S.legacyMigrated=true;
 if(!raw){save();return}
 try{
   let old=JSON.parse(raw), imported=0;
   for(const ce of old.customExercises||[]){
     if(S.exercises.some(x=>x.id===ce.id))continue;
     S.exercises.push({id:ce.id||uid('custom'),name:ce.name||'Custom Exercise',equipment:ce.equip||'Other',muscle:ce.muscle||'Other',custom:true,gym:''});
   }
   for(const w of (old.h||[]).slice().reverse()){
     const exercises=(w.snap||[]).map(e=>({id:e.id,name:e.name||exById(e.id)?.name||e.id,equipment:e.equip||'',sets:(e.sets||[]).filter(x=>x.d).map(x=>({weight:Number(x.w)||0,reps:Number(x.r)||0,done:true,note:x.n||''}))})).filter(e=>e.sets.length);
     if(!exercises.length)continue;
     const parsed=Date.parse(w.date); const when=Number.isFinite(parsed)?parsed:Date.now()-imported*86400000;
     S.sessions.unshift({id:uid('legacy'),type:'strength',startedAt:when-(Number(w.elapsed)||0)*1000,endedAt:when,title:'Strength',legacyTitle:w.name||'',exercises,elapsed:Number(w.elapsed)||0});imported++;
   }
   // Add legacy-used exercises that were not in the slimmer starter library.
   for(const w of old.h||[])for(const e of w.snap||[]){if(!S.exercises.some(x=>x.id===e.id))S.exercises.push({id:e.id,name:e.name||e.id,equipment:e.equip||'Other',muscle:e.muscle||'Other',custom:false,gym:''});}
   save(); if(imported)sessionStorage.setItem('pp_migration_notice',String(imported));
 }catch(e){save()}
}

function bottomnav(){return `<div class="bottomnav"><div class="navinner">${[['log','⌂','HOME'],['history','◌','HISTORY'],['settings','✦','SETTINGS']].map(n=>`<button class="navbtn ${S.view===n[0]?'active':''}" onclick="PP.go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')}</div></div>`}

function render(){
 stopRestTicker();stopQuoteTicker();clearInterval(ellipticalTimer);clearInterval(yogaTimer);ellipticalTimer=null;yogaTimer=null;
 const root=document.getElementById('app');
 const views={log:logView,history:historyView,settings:settingsView,strength:strengthView,elliptical:ellipticalView,yoga:yogaView};
 root.innerHTML=(views[S.view]||logView)()+((['log','history','settings'].includes(S.view))?bottomnav():'')+modalHTML();
 if(S.view==='strength'){hydratePhotos();startRestTicker();startQuoteTicker('strength');requestAnimationFrame(scrollActiveIfNeeded)}
 if(S.view==='elliptical'){startQuoteTicker('elliptical');if(S.active?.type==='elliptical'&&S.active.timerStartedAt)startSimpleTimer('ellTimer',S.active)}if(S.view==='yoga'){startQuoteTicker('yoga');if(S.active?.type==='yoga'&&S.active.timerStartedAt)startYogaTicker(S.active)}
 if(modal?.type==='picker')requestAnimationFrame(hydratePickerPhotos);
 if(modal?.type==='exerciseProgress')requestAnimationFrame(()=>hydrateProgressPhoto(modal.exerciseId));
 const mig=sessionStorage.getItem('pp_migration_notice');if(mig){sessionStorage.removeItem('pp_migration_notice');setTimeout(()=>toast(`${mig} older workouts carried into Peak Progress 2.0`),250)}
 save();syncWakeLock();
}
function go(v){S.view=v;modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function back(){if(['strength','elliptical','yoga'].includes(S.view))clearEmptyActive();S.view='log';modal=null;render()}

function logView(){
 const last=S.sessions[0];
 return topbar()+`<div class="modegrid">
 <button class="mode" onclick="PP.openStrength()">${modeSigil('strength','modeicon')}<strong>Strength</strong>${S.active?.type==='strength'&&hasMeaningfulActive()?'<span>Continue active workout</span>':''}</button>
 <button class="mode" onclick="PP.openCardio()">${modeSigil('elliptical','modeicon')}<strong>Elliptical</strong>${S.active?.type==='elliptical'&&hasMeaningfulActive()?'<span>Continue active session</span>':''}</button>
 <button class="mode" onclick="PP.openYoga()">${modeSigil('yoga','modeicon')}<strong>Yoga</strong>${S.active?.type==='yoga'&&hasMeaningfulActive()?'<span>Continue active session</span>':''}</button>
 </div>
 ${last?`<div class="sectionhead"><h3>Recent</h3><button onclick="PP.go('history')">VIEW HISTORY</button></div>${sessionCard(last,true)}`:''}`
}

function startStrength(){S.active={id:uid('workout'),type:'strength',startedAt:Date.now(),exercises:[],restUntil:0};S.activeExerciseId=null;S.view='strength';render()}
function openStrength(){clearEmptyActive();if(S.active&&S.active.type!=='strength'){modal={type:'activeConflict',target:'strength'};render();return}if(!S.active)startStrength();else go('strength')}
function strengthView(){
 const a=activeStrength();if(!a){startStrength();return ''}
 const elapsed=Math.floor((Date.now()-a.startedAt)/1000);
 const sets=a.exercises.reduce((n,e)=>n+completedSets(e).length,0);
 return topbar(true)+sectionQuote('strength')+`<div class="sessionline"><div><div class="eyebrow">Today's work</div><b>${todayLabel()}</b></div><div class="sessionfacts"><span><b>${sets}</b> sets</span><span id="strengthElapsed">${fmtSec(elapsed)}</span></div></div>
 ${a.exercises.length?a.exercises.map((e,i)=>exerciseCard(e,i)).join(''):''}
 ${a.exercises.length?`<button class="discardlink" onclick="PP.discardActive()">Discard session</button>`:''}
 ${restBar()}<div class="workoutdock"><button class="btn secondary" onclick="PP.openExercisePicker()"><span class="dockplus">+</span> Exercise</button><button class="btn" onclick="PP.finishStrength()" ${a.exercises.length?'':'disabled'}>Finish</button></div>`
}
function exerciseCard(ex,idx){
 const active=S.activeExerciseId===ex.instanceId;
 const summary=completedSets(ex).map(s=>setText(ex,s)).join(' · ')||`${ex.sets.length} set${ex.sets.length===1?'':'s'} ready`;
 const last=lastPerformance(ex.exerciseId);
 return `<div class="card exercise-card ${active?'active':''}" id="ex-${esc(ex.instanceId)}" draggable="true" ondragstart="PP.dragStart(event,'${esc(ex.instanceId)}')" ondragover="event.preventDefault()" ondrop="PP.dropExercise(event,'${esc(ex.instanceId)}')">
 <div class="exercise-head" onclick="PP.activateExercise('${esc(ex.instanceId)}')"><div class="drag" onclick="event.stopPropagation()">⋮⋮</div><div id="photo-${esc(ex.exerciseId)}" class="explaceholder">◈</div><div class="exmeta"><b>${esc(ex.name)}${ex.gym?`<span class="gymtag">${esc(ex.gym)}</span>`:''}${active?'<span class="activeflag">active</span>':''}</b><div class="exsummary">${esc(summary)}</div></div><button class="chev">${active?'⌃':'⌄'}</button></div>
 ${active?`<div class="exercise-body">${last?`<div class="lasttime"><button class="historylink" onclick="event.stopPropagation();PP.openExerciseProgress('${esc(ex.exerciseId)}')">History ›</button><b>Last time</b> · ${esc(last)}</div>`:`<div class="lasttime"><button class="historylink" onclick="event.stopPropagation();PP.openExerciseProgress('${esc(ex.exerciseId)}')">History ›</button><b>No earlier sets yet</b></div>`}
 ${ex.setupNote?`<div class="setupnote"><b>Setup</b> · ${esc(ex.setupNote)}</div>`:''}<div class="captionrow"><span>Set</span><span>${isBodyweight(ex)?`Added load (${esc(S.settings.unit)})`:`Weight (${esc(S.settings.unit)})`}</span><span>Reps</span><span>Done</span></div>
 ${ex.sets.map((s,j)=>setRow(ex,s,j,ex.sets.findIndex(x=>!x.done)===j)).join('')}
 <div class="setactions"><button class="btn secondary small addset" onclick="PP.addSet('${esc(ex.instanceId)}')">+ Set</button><button class="btn ghost small removeset" onclick="PP.removeSet('${esc(ex.instanceId)}')" ${ex.sets.length<=1?'disabled':''}>− Set</button><button id="photo-action-${esc(ex.exerciseId)}" class="btn ghost small" onclick="PP.openPhoto('${esc(ex.exerciseId)}')">📷 Photo</button><button class="btn ghost small morebtn" onclick="PP.exerciseOptions('${esc(ex.instanceId)}')" aria-label="More exercise options">•••</button></div></div>`:''}</div>`
}
function setRow(ex,s,j,isNext){return `<div class="setgrid ${s.done?'completed':isNext?'nextset':''}"><div class="setnum">${j+1}</div><div class="numfield"><button type="button" class="stepbtn" aria-label="Decrease weight by 5" onclick="PP.stepSet('${esc(ex.instanceId)}','${esc(s.id)}','weight',-5)">−</button><input data-set-id="${esc(s.id)}" data-field="weight" aria-label="${isBodyweight(ex)?'Added load':'Weight'} set ${j+1}" inputmode="decimal" type="text" enterkeyhint="next" value="${isBodyweight(ex)&&num(s.weight)===0?'':num(s.weight)}" placeholder="${isBodyweight(ex)?'BW':''}" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartSetBeforeInput(event,'${esc(ex.instanceId)}','${esc(s.id)}','weight')" oninput="PP.smartSetInput(this,'${esc(ex.instanceId)}','${esc(s.id)}','weight')" onkeydown="PP.nextField(event,'${esc(ex.instanceId)}','${esc(s.id)}','weight')"><button type="button" class="stepbtn" aria-label="Increase weight by 5" onclick="PP.stepSet('${esc(ex.instanceId)}','${esc(s.id)}','weight',5)">+</button></div><div class="numfield"><button type="button" class="stepbtn" aria-label="Decrease reps by 1" onclick="PP.stepSet('${esc(ex.instanceId)}','${esc(s.id)}','reps',-1)">−</button><input data-set-id="${esc(s.id)}" data-field="reps" aria-label="Reps set ${j+1}" inputmode="numeric" pattern="[0-9]*" type="text" enterkeyhint="next" value="${num(s.reps)}" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartSetBeforeInput(event,'${esc(ex.instanceId)}','${esc(s.id)}','reps')" oninput="PP.smartSetInput(this,'${esc(ex.instanceId)}','${esc(s.id)}','reps')" onkeydown="PP.nextField(event,'${esc(ex.instanceId)}','${esc(s.id)}','reps')"><button type="button" class="stepbtn" aria-label="Increase reps by 1" onclick="PP.stepSet('${esc(ex.instanceId)}','${esc(s.id)}','reps',1)">+</button></div><button class="donebox ${s.done?'done':''}" aria-label="${s.done?'Mark set incomplete':'Mark set complete'}" onclick="PP.toggleSet('${esc(ex.instanceId)}','${esc(s.id)}')">${s.done?'✓':'○'}</button></div>`}
function num(v){return Number.isFinite(Number(v))?Number(v):0}
function isBodyweight(ex){return (ex?.equipment||'')==='Bodyweight'}
function setText(ex,set,withUnit=false){let w=num(set?.weight),r=num(set?.reps);if(isBodyweight(ex))return w>0?`+${w}${withUnit?' '+S.settings.unit:''} × ${r}`:`${r} rep${r===1?'':'s'}`;return `${w}${withUnit?' '+S.settings.unit:''}×${r}`}
function activateExercise(id){S.activeExerciseId=S.activeExerciseId===id?null:id;render()}
function cleanNumericText(val,key){if(val==='')return '';let cleaned=String(val).replace(key==='reps'?/[^0-9]/g:/[^0-9.]/g,'');if(key!=='reps'){let parts=cleaned.split('.');if(parts.length>2)cleaned=parts.shift()+'.'+parts.join('')}return cleaned}
function cleanNumeric(val,key){let cleaned=cleanNumericText(val,key);return cleaned===''?'':Number(cleaned)}
function armNumber(el){el.dataset.replaceFirst='1';el.dataset.originalValue=el.value}
function disarmNumber(el){el.dataset.replaceFirst='0';delete el.dataset.originalValue}
function insertedNumericPart(before,after){let a=String(before??''),b=String(after??''),start=0;while(start<a.length&&start<b.length&&a[start]===b[start])start++;let ai=a.length-1,bi=b.length-1;while(ai>=start&&bi>=start&&a[ai]===b[bi]){ai--;bi--}return b.slice(start,bi+1)}
function finalizeNumericInput(el,key,apply){if(el.dataset.replaceFirst==='1'){let added=insertedNumericPart(el.dataset.originalValue||'',el.value);let cleaned=cleanNumericText(added,key);if(cleaned!==''){el.value=cleaned;apply(cleaned);disarmNumber(el);try{el.setSelectionRange(el.value.length,el.value.length)}catch{}return}}apply(el.value);disarmNumber(el)}
function firstNumericInsertion(ev,key,apply){let el=ev.currentTarget;if(el.dataset.replaceFirst!=='1')return false;if(ev.inputType&&ev.inputType.startsWith('delete')){disarmNumber(el);return false}if(!ev.inputType||!ev.inputType.startsWith('insert')||ev.data==null)return false;let cleaned=cleanNumericText(ev.data,key);if(cleaned==='')return false;ev.preventDefault();el.value=cleaned;disarmNumber(el);apply(cleaned);try{el.setSelectionRange(el.value.length,el.value.length)}catch{}return true}
function smartSetBeforeInput(ev,eid,sid,key){firstNumericInsertion(ev,key,v=>setValue(eid,sid,key,v))}
function smartSetInput(el,eid,sid,key){finalizeNumericInput(el,key,v=>setValue(eid,sid,key,v))}
function smartActiveBeforeInput(ev,key){firstNumericInsertion(ev,'weight',v=>setActiveField(key,v,true))}
function smartActiveInput(el,key){finalizeNumericInput(el,'weight',v=>setActiveField(key,v,true))}
function setValue(eid,sid,key,val){let e=activeStrength()?.exercises.find(x=>x.instanceId===eid),s=e?.sets.find(x=>x.id===sid);if(!s)return;s[key]=cleanNumeric(val,key);save()}
function stepSet(eid,sid,key,delta){let e=activeStrength()?.exercises.find(x=>x.instanceId===eid),s=e?.sets.find(x=>x.id===sid);if(!s)return;let current=Number(s[key]);if(!Number.isFinite(current))current=0;let next=Math.max(0,current+Number(delta||0));if(key==='reps')next=Math.round(next);else next=Math.round(next*100)/100;s[key]=next;save();let card=document.getElementById('ex-'+CSS.escape(eid)),input=card?.querySelector(`input[data-set-id="${CSS.escape(sid)}"][data-field="${key}"]`);if(input){input.value=(isBodyweight(e)&&key==='weight'&&next===0)?'':String(next);input.dataset.originalValue=input.value;input.dataset.replaceFirst='1'}if(s.done){let copy=card?.querySelector('.exsummary');if(copy)copy.textContent=completedSets(e).map(x=>setText(e,x)).join(' · ')||`${e.sets.length} set${e.sets.length===1?'':'s'} ready`}}
function focusSetField(eid,sid,key){requestAnimationFrame(()=>{let card=document.getElementById('ex-'+CSS.escape(eid));let target=card?.querySelector(`input[data-set-id="${sid}"][data-field="${key}"]`);if(target){target.focus();try{let n=target.value.length;target.setSelectionRange(n,n)}catch{}}})}
function nextField(ev,eid,sid,key){if(ev.key!=='Enter')return;ev.preventDefault();let e=activeStrength()?.exercises.find(x=>x.instanceId===eid);if(!e)return;let i=e.sets.findIndex(x=>x.id===sid);if(i<0)return;if(key==='weight'){let row=ev.target.closest('.setgrid');let reps=row?.querySelectorAll('input')?.[1];if(reps){reps.focus();try{let n=reps.value.length;reps.setSelectionRange(n,n)}catch{}}return}let next=e.sets[i+1];if(next){focusSetField(eid,next.id,'weight');return}addSet(eid)}
function addSet(eid){let e=activeStrength()?.exercises.find(x=>x.instanceId===eid);if(!e)return;let prev=e.sets[e.sets.length-1]||lastSetFor(e.exerciseId)||{weight:0,reps:10};let added={id:uid('set'),weight:num(prev.weight),reps:num(prev.reps),done:false,note:''};e.sets.push(added);S.activeExerciseId=eid;render()}
function removeSet(eid){let e=activeStrength()?.exercises.find(x=>x.instanceId===eid);if(!e||e.sets.length<=1)return;e.sets.pop();render()}
function toggleSet(eid,sid){let e=activeStrength()?.exercises.find(x=>x.instanceId===eid),s=e?.sets.find(x=>x.id===sid);if(!s)return;s.done=!s.done;if(s.done&&S.settings.restSeconds>0){primeRestAudio();S.active.restUntil=Date.now()+S.settings.restSeconds*1000}render()}
function removeExercise(eid){let a=activeStrength();if(!a)return;a.exercises=a.exercises.filter(x=>x.instanceId!==eid);if(S.activeExerciseId===eid)S.activeExerciseId=a.exercises[0]?.instanceId||null;render()}
function moveExercise(eid,delta){let a=activeStrength(),i=a?.exercises.findIndex(x=>x.instanceId===eid);if(i<0)return;let j=Math.max(0,Math.min(a.exercises.length-1,i+delta));if(i===j)return;let [x]=a.exercises.splice(i,1);a.exercises.splice(j,0,x);S.activeExerciseId=eid;render();requestAnimationFrame(scrollActiveIfNeeded)}
let dragged=null;function dragStart(ev,id){dragged=id;ev.dataTransfer.effectAllowed='move'}function dropExercise(ev,target){ev.preventDefault();let a=activeStrength();if(!a||!dragged||dragged===target)return;let i=a.exercises.findIndex(x=>x.instanceId===dragged),j=a.exercises.findIndex(x=>x.instanceId===target);let [x]=a.exercises.splice(i,1);a.exercises.splice(j,0,x);S.activeExerciseId=dragged;dragged=null;render()}
function scrollActiveIfNeeded(){let id=S.activeExerciseId;if(!id)return;let el=document.getElementById('ex-'+CSS.escape(id));if(el&&sessionStorage.getItem('pp_scroll_new')===id){sessionStorage.removeItem('pp_scroll_new');el.scrollIntoView({behavior:'smooth',block:'center'})}}
function lastSetFor(exerciseId){for(const s of S.sessions){if(s.type!=='strength')continue;let e=s.exercises?.find(x=>x.id===exerciseId);if(e?.sets?.length)return e.sets[e.sets.length-1]}return null}
function lastPerformance(exerciseId){for(const s of S.sessions){if(s.type!=='strength')continue;let e=s.exercises?.find(x=>x.id===exerciseId);if(e?.sets?.length)return e.sets.map(x=>setText(e,x)).join(' · ')}return ''}
function addExerciseToWorkout(id){let base=exById(id);if(!base)return;let a=activeStrength();if(!a)return;let existing=a.exercises.find(x=>x.exerciseId===id);if(existing){S.activeExerciseId=existing.instanceId;sessionStorage.setItem('pp_scroll_new',existing.instanceId);modal=null;render();toast('Already in this session');return}let prev=lastSetFor(id)||{weight:0,reps:10};let ex={instanceId:uid('ex'),exerciseId:id,name:base.name,gym:base.gym||'',setupNote:base.setupNote||'',equipment:base.equipment,muscle:base.muscle,sets:[{id:uid('set'),weight:num(prev.weight),reps:num(prev.reps),done:false,note:''}]};let current=a.exercises.findIndex(x=>x.instanceId===S.activeExerciseId);let at=current>=0?current+1:a.exercises.length;a.exercises.splice(at,0,ex);S.activeExerciseId=ex.instanceId;sessionStorage.setItem('pp_scroll_new',ex.instanceId);modal=null;render()}

function recentExerciseIds(){let ids=[];for(const s of S.sessions){if(s.type!=='strength')continue;for(const e of s.exercises||[]){if(!ids.includes(e.id))ids.push(e.id)}}return ids}
function modalHTML(){if(!modal)return '';if(modal.type==='picker')return exercisePickerHTML();if(modal.type==='newExercise')return newExerciseHTML();if(modal.type==='editExercise')return editExerciseHTML();if(modal.type==='manageExercises')return manageExercisesHTML();if(modal.type==='photo')return photoHTML(modal.exerciseId);if(modal.type==='exerciseOptions')return exerciseOptionsHTML(modal.exerciseId);if(modal.type==='exerciseProgress')return exerciseProgressHTML(modal.exerciseId);if(modal.type==='activityProgress')return activityProgressHTML(modal.activityType);if(modal.type==='editSession')return editSessionHTML();if(modal.type==='finishStrength')return finishStrengthHTML();if(modal.type==='activeConflict')return activeConflictHTML();return ''}
function openExercisePicker(){modal={type:'picker',q:'',equip:'All',recentOnly:false,mineOnly:false,favoriteOnly:false};render()}
function exercisePickerResultsHTML(){let q=(modal.q||'').toLowerCase(),equip=modal.equip||'All',recent=recentExerciseIds(),recentTop=recent.slice(0,12),recentOnly=!!modal.recentOnly,mineOnly=!!modal.mineOnly,favoriteOnly=!!modal.favoriteOnly,favs=new Set(S.favoriteExerciseIds||[]),inSession=new Set((activeStrength()?.exercises||[]).map(x=>x.exerciseId));let list=S.exercises.filter(e=>(!recentOnly||recentTop.includes(e.id))&&(!mineOnly||e.custom)&&(!favoriteOnly||favs.has(e.id))&&(equip==='All'||e.equipment===equip)&&(!q||(e.name+' '+e.equipment+' '+e.muscle+' '+(e.gym||'')).toLowerCase().includes(q))).sort((a,b)=>{let af=favs.has(a.id)?0:1,bf=favs.has(b.id)?0:1;if(af!==bf)return af-bf;let ai=recent.indexOf(a.id),bi=recent.indexOf(b.id);ai=ai<0?999:ai;bi=bi<0?999:bi;return ai-bi||a.name.localeCompare(b.name)});return list.length?list.map((e,i)=>{let here=inSession.has(e.id),fav=favs.has(e.id);return `<div class="pick"><button class="pickselect" onclick="PP.addExercise('${esc(e.id)}')"><span class="pickmain"><span class="pickthumb" data-pick-photo="${esc(e.id)}">◈</span><span class="picktext"><b>${esc(e.name)}</b><small>${esc(e.equipment)}${e.gym?` · <span class="gymlabel">${esc(e.gym)}</span>`:''} · ${esc(e.muscle)}${e.custom?' · yours':''}${here?' · in session':recent.includes(e.id)&&i<8?' · recent':''}</small></span></span><span>${here?'→':'＋'}</span></button><button class="pickstar ${fav?'on':''}" aria-label="${fav?'Remove from favorites':'Add to favorites'}" onclick="PP.toggleFavorite('${esc(e.id)}')">${fav?'★':'☆'}</button></div>`}).join(''):`<div class="empty"><p>No exercises match these filters.</p><button class="btn secondary" onclick="PP.clearExerciseFilters()">Clear Filters</button>${!recentOnly&&!favoriteOnly&&!mineOnly?`<button class="btn" style="margin-top:8px" onclick="PP.newExercise()">Create Exercise</button>`:''}</div>`}
function exercisePickerHTML(){let equip=modal.equip||'All',recentOnly=!!modal.recentOnly,mineOnly=!!modal.mineOnly,favoriteOnly=!!modal.favoriteOnly,filters=['All','Bodyweight','Dumbbells','EZ Bar','Stack Machine','Plate-Loaded Machine','Cable','Barbell','Plates'];return `<div class="sheetback" onclick="if(event.target===this)PP.closeModal()"><div class="sheet pickersheet"><div class="sheetgrab"></div><div class="row between"><div><div class="eyebrow">Add exercise</div><h3>Choose your movement</h3></div><button class="iconbtn" onclick="PP.closeModal()">×</button></div><div class="searchrow"><input id="exerciseSearch" placeholder="Search your exercises" value="${esc(modal.q||'')}" oninput="PP.searchExercises(this.value)"><button class="btn secondary small" onclick="PP.newExercise()">+ New</button></div><div class="filterlabel">Quick</div><div class="filterchips"><button class="filterchip ${recentOnly?'on':''}" onclick="PP.toggleRecentExercises()">Recent</button><button class="filterchip ${favoriteOnly?'on':''}" onclick="PP.toggleFavoriteFilter()">★ Favorites</button>${S.exercises.some(e=>e.custom)?`<button class="filterchip ${mineOnly?'on':''}" onclick="PP.toggleMineExercises()">Mine</button>`:''}</div><div class="filterlabel">Equipment</div><div class="filterchips equipmentchips" id="equipmentFilterChips">${filters.map(f=>`<button class="filterchip ${equip===f?'on':''}" onclick="PP.filterEquipment('${esc(f)}',this)">${esc(f)}</button>`).join('')}</div><div id="exercisePickerResults">${exercisePickerResultsHTML()}</div></div></div>`}
function searchExercises(q){if(!modal||modal.type!=='picker')return;modal.q=q;let host=document.getElementById('exercisePickerResults');if(host){host.innerHTML=exercisePickerResultsHTML();hydratePickerPhotos()}}
function filterEquipment(equip,btn){if(!modal||modal.type!=='picker')return;modal.equip=equip;let row=btn?.closest('.equipmentchips')||document.getElementById('equipmentFilterChips'),left=row?.scrollLeft||0;if(row){row.querySelectorAll('.filterchip').forEach(x=>x.classList.remove('on'));btn?.classList.add('on')}let host=document.getElementById('exercisePickerResults');if(host){host.innerHTML=exercisePickerResultsHTML();hydratePickerPhotos()}if(row)requestAnimationFrame(()=>{row.scrollLeft=left})}
function toggleRecentExercises(){modal.recentOnly=!modal.recentOnly;render()}

function newExerciseHTML(){let seed=modal.seed||{},seedName=seed.name||'',seedEquip=seed.equipment||'Dumbbells',seedMuscle=seed.muscle||'Chest',seedGym=seed.gym||'',seedSetup=seed.setupNote||'';return `<div class="sheetback"><div class="sheet"><div class="sheetgrab"></div><div class="row between"><div><div class="eyebrow">Your library</div><h3>${seedName?'Gym-specific variant':'New exercise'}</h3></div><button class="iconbtn" onclick="PP.closeModal()">×</button></div><div class="formfield"><label>Name</label><input id="newExName" value="${esc(seedName)}" placeholder="e.g. Hammer Strength Chest Press"></div><div class="formfield"><label>Gym · optional</label><input id="newExGym" value="${esc(seedGym)}" placeholder="Gold's, Crunch, hotel gym..."></div><div class="formfield"><label>Setup note · optional</label><input id="newExSetup" value="${esc(seedSetup)}" placeholder="Seat 4 · back pad 2"></div><div class="twocol"><div class="formfield"><label>Equipment</label><select id="newExEquip">${EQUIPMENT.map(x=>`<option ${x===seedEquip?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="formfield"><label>Muscle</label><select id="newExMuscle">${MUSCLES.map(x=>`<option ${x===seedMuscle?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><button class="btn block" onclick="PP.saveNewExercise()">Save & Add</button></div></div>`}

function manageExercisesHTML(){let mine=S.exercises.filter(e=>e.custom).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="sheetback" onclick="if(event.target===this)PP.closeModal()"><div class="sheet"><div class="sheetgrab"></div><div class="row between"><div><div class="eyebrow">Exercise library</div><h3>My exercises</h3></div><button class="iconbtn" onclick="PP.closeModal()">×</button></div>${mine.length?mine.map(e=>`<div class="libraryrow"><div class="libmeta"><b>${esc(e.name)}${e.gym?`<span class="gymtag">${esc(e.gym)}</span>`:''}</b><span class="muted small">${esc(e.equipment)} · ${esc(e.muscle)}</span></div><div class="libactions"><button class="btn ghost small" onclick="PP.openPhoto('${esc(e.id)}')" aria-label="Photo">📷</button><button class="btn secondary small" onclick="PP.editCustomExercise('${esc(e.id)}')">Edit</button></div></div>`).join(''):`<div class="empty"><p>No custom exercises yet.</p></div>`}</div></div>`}
function editCustomExercise(id){let e=exById(id);if(!e?.custom)return;modal={type:'editExercise',exerciseId:id};render()}
function editExerciseHTML(){let e=exById(modal.exerciseId);if(!e?.custom){modal=null;return ''}return `<div class="sheetback"><div class="sheet"><div class="sheetgrab"></div><div class="row between"><div><div class="eyebrow">My exercise</div><h3>Edit movement</h3></div><button class="iconbtn" onclick="PP.closeModal()">×</button></div><div class="formfield"><label>Name</label><input id="editExName" value="${esc(e.name)}"></div><div class="formfield"><label>Gym · optional</label><input id="editExGym" value="${esc(e.gym||'')}" placeholder="Gold's, Crunch, hotel gym..."></div><div class="formfield"><label>Setup note · optional</label><input id="editExSetup" value="${esc(e.setupNote||'')}" placeholder="Seat 4 · back pad 2"></div><div class="twocol"><div class="formfield"><label>Equipment</label><select id="editExEquip">${EQUIPMENT.map(x=>`<option ${x===e.equipment?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="formfield"><label>Muscle</label><select id="editExMuscle">${MUSCLES.map(x=>`<option ${x===e.muscle?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><button class="btn block" onclick="PP.saveEditedExercise('${esc(e.id)}')">Save Changes</button><button class="btn ghost block" style="margin-top:8px" onclick="PP.openPhoto('${esc(e.id)}')">📷 Equipment Photo</button><button class="btn danger block" style="margin-top:16px" onclick="PP.deleteCustomExercise('${esc(e.id)}')">Delete from Library</button></div></div>`}
function saveEditedExercise(id){let e=exById(id);if(!e?.custom)return;let name=document.getElementById('editExName')?.value.trim();if(!name){toast('Give the exercise a name');return}e.name=name;e.gym=document.getElementById('editExGym')?.value.trim()||'';e.setupNote=document.getElementById('editExSetup')?.value.trim()||'';e.equipment=document.getElementById('editExEquip')?.value||'Other';e.muscle=document.getElementById('editExMuscle')?.value||'Other';if(activeStrength())for(const x of S.active.exercises.filter(x=>x.exerciseId===id)){x.name=e.name;x.gym=e.gym;x.setupNote=e.setupNote;x.equipment=e.equipment;x.muscle=e.muscle}save();modal=S.view==='settings'?{type:'manageExercises'}:null;render();toast('Exercise updated')}
async function deleteCustomExercise(id){let e=exById(id);if(!e?.custom)return;if(activeStrength()?.exercises.some(x=>x.exerciseId===id)){toast('Remove it from the active workout first');return}if(!confirm(`Delete “${e.name}” from your exercise library? Saved workout history will remain.`))return;S.exercises=S.exercises.filter(x=>x.id!==id);S.favoriteExerciseIds=(S.favoriteExerciseIds||[]).filter(x=>x!==id);try{await photoDelete(id);photoPresence.delete(id);if(photoUrls[id]){URL.revokeObjectURL(photoUrls[id]);delete photoUrls[id]}}catch{}save();modal={type:'manageExercises'};render();toast('Exercise removed')}
function openPhoto(exerciseId){modal={type:'photo',exerciseId};render();setTimeout(()=>loadPhotoIntoModal(exerciseId),40)}
function saveSetupNote(id,value){let e=exById(id);if(!e)return;e.setupNote=String(value||'').trim();if(activeStrength())for(const x of S.active.exercises.filter(x=>x.exerciseId===id))x.setupNote=e.setupNote;save()}
function photoHTML(id){let e=exById(id);return `<div class="sheetback"><div class="sheet"><div class="sheetgrab"></div><div class="row between"><div><div class="eyebrow">Equipment photo</div><h3>${esc(e?.name||'Exercise')}</h3></div><button class="iconbtn" onclick="PP.closeModal()">×</button></div><div id="photoModalBox" class="photobox">No photo yet.</div><div class="formfield"><label>Setup note · optional</label><input value="${esc(e?.setupNote||'')}" placeholder="Seat 4 · back pad 2" oninput="PP.saveSetupNote('${esc(id)}',this.value)"></div><input class="hidden" id="photoInput" type="file" accept="image/*" capture="environment" onchange="PP.handlePhoto('${esc(id)}',this.files[0])"><button class="btn block" onclick="document.getElementById('photoInput').click()">📷 Take / Choose Photo</button><button class="btn ghost block" style="margin-top:8px" onclick="PP.removePhoto('${esc(id)}')">Remove Photo</button><p class="muted small backupnote">Stored on this device and included in full backups.</p></div></div>`}
async function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function photoPut(id,blob){let db=await openDB();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function photoGet(id){let db=await openDB();return new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function photoDelete(id){let db=await openDB();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function photoKeys(){let db=await openDB();return new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
function blobToDataURL(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function dataURLToBlob(data){let parts=String(data||'').split(','),meta=parts[0]||'',body=parts.slice(1).join(','),mime=(meta.match(/^data:([^;]+)/)||[])[1]||'application/octet-stream',bytes=meta.includes(';base64')?atob(body):decodeURIComponent(body),arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);return new Blob([arr],{type:mime})}
async function clearPhotos(){let db=await openDB();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

async function compressPhoto(file){let img;if('createImageBitmap' in window){img=await createImageBitmap(file)}else{img=await new Promise((res,rej)=>{let u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}let max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(res=>c.toBlob(res,'image/jpeg',.82))}
async function getPhotoUrl(id){if(photoUrls[id])return photoUrls[id];if(photoPresence.get(id)===false)return null;let b=await photoGet(id);photoPresence.set(id,!!b);if(!b)return null;let u=URL.createObjectURL(b);photoUrls[id]=u;return u}
async function handlePhoto(id,file){if(!file)return;try{let blob=await compressPhoto(file);await photoPut(id,blob);photoPresence.set(id,true);if(photoUrls[id]){URL.revokeObjectURL(photoUrls[id]);delete photoUrls[id]}toast('Equipment photo saved');loadPhotoIntoModal(id);hydratePhotos();hydratePickerPhotos()}catch(e){toast('Could not save photo')}}
async function removePhoto(id){await photoDelete(id);photoPresence.set(id,false);if(photoUrls[id]){URL.revokeObjectURL(photoUrls[id]);delete photoUrls[id]}loadPhotoIntoModal(id);hydratePhotos();hydratePickerPhotos();toast('Photo removed')}
async function loadPhotoIntoModal(id){let box=document.getElementById('photoModalBox');if(!box)return;let u=await getPhotoUrl(id);if(!u){box.className='photobox';box.innerHTML='No equipment photo saved yet.';return}box.className='';box.innerHTML=`<img class="photohero" src="${u}" alt="Equipment photo">`}
async function hydratePhotos(){let a=activeStrength();if(!a)return;for(const e of a.exercises){let u=await getPhotoUrl(e.exerciseId),host=document.getElementById('photo-'+e.exerciseId),action=document.getElementById('photo-action-'+e.exerciseId);if(!u)continue;if(host&&!host.matches('img'))host.outerHTML=`<img id="photo-${esc(e.exerciseId)}" class="exthumb" src="${u}" alt="${esc(e.name)} equipment">`;if(action&&!action.querySelector('.photoattached'))action.insertAdjacentHTML('beforeend',' <span class="photoattached">•</span>')}}
async function hydratePickerPhotos(){let hosts=[...document.querySelectorAll('[data-pick-photo]')];for(const host of hosts){let id=host.dataset.pickPhoto,u=await getPhotoUrl(id);if(!u||!host.isConnected)continue;host.innerHTML=`<img src="${u}" alt=""><span class="photobadge">📷</span>`}}


function finishStrength(){if(!activeStrength()?.exercises.length)return;modal={type:'finishStrength'};render()}
function finishStrengthHTML(){let a=activeStrength(),done=a.exercises.reduce((n,e)=>n+completedSets(e).length,0),pending=a.exercises.reduce((n,e)=>n+(e.sets||[]).filter(x=>!x.done&&(Number(x.weight)>0||Number(x.reps)>0)).length,0);return `<div class="sheetback"><div class="sheet"><div class="sheetgrab"></div><div class="eyebrow">Finish session</div><h3>${done} completed set${done===1?'':'s'}</h3><p class="subtitle">Optional name. Otherwise it saves as Strength.${pending?` <b>${pending} unfinished set${pending===1?' is':'s are'} not marked done and won't be saved.</b>`:''}</p><div class="formfield"><label>Session name (optional)</label><input id="sessionName" placeholder="Strength · ${todayLabel()}"></div><button class="btn block" onclick="PP.saveStrength()">Save Strength Session</button><button class="btn ghost block" style="margin-top:8px" onclick="PP.closeModal()">Keep Working</button></div></div>`}
function saveStrength(){let a=activeStrength();if(!a)return;let exercises=a.exercises.map(e=>({id:e.exerciseId,name:e.name,gym:e.gym||'',equipment:e.equipment,sets:completedSets(e).map(s=>({weight:num(s.weight),reps:num(s.reps),done:true,note:s.note||''}))})).filter(e=>e.sets.length);if(!exercises.length){toast('Complete at least one set first');return}let end=Date.now(),title=document.getElementById('sessionName')?.value.trim()||'Strength';S.sessions.unshift({id:a.id,type:'strength',startedAt:a.startedAt,endedAt:end,elapsed:Math.floor((end-a.startedAt)/1000),title,exercises});S.active=null;S.activeExerciseId=null;modal=null;S.view='history';render();toast('Strength session saved')}
function discardActive(){if(!confirm('Discard this active session?'))return;S.active=null;S.activeExerciseId=null;go('log')}
function restBar(){let a=activeStrength();if(!a?.restUntil)return '';let left=Math.ceil((a.restUntil-Date.now())/1000);if(left<=0){a.restUntil=0;return ''}return `<div class="restbar" id="restBar"><div class="time" id="restTime">${fmtSec(left)}</div><div class="grow"><b style="color:var(--bone)">REST</b><br>Next set when you're ready.</div><button class="btn ghost small" onclick="PP.addRest(30)">+30</button><button class="btn secondary small" onclick="PP.skipRest()">Skip</button></div>`}
function startRestTicker(){let a=activeStrength();if(!a)return;let tick=()=>{let elapsed=document.getElementById('strengthElapsed');if(elapsed)elapsed.textContent=fmtSec(Math.floor((Date.now()-a.startedAt)/1000));if(!a.restUntil)return;let left=Math.ceil((a.restUntil-Date.now())/1000),el=document.getElementById('restTime');if(left<=0){a.restUntil=0;document.getElementById('restBar')?.remove();save();notifyRestEnd();return}if(el)el.textContent=fmtSec(left)};tick();restInterval=setInterval(tick,1000)}function stopRestTicker(){if(restInterval){clearInterval(restInterval);restInterval=null}}function addRest(s){if(activeStrength())S.active.restUntil=Math.max(Date.now(),S.active.restUntil||0)+s*1000;render()}function skipRest(){if(activeStrength())S.active.restUntil=0;render()}
function primeRestAudio(){if(!String(S.settings.restAlert||'').includes('sound'))return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!restAudioCtx)restAudioCtx=new C();if(restAudioCtx.state==='suspended')restAudioCtx.resume().catch(()=>{})}catch{}}
function notifyRestEnd(){let mode=S.settings.restAlert||'off';if(mode==='off')return;if(mode.includes('vibrate')&&navigator.vibrate)navigator.vibrate([160,80,160]);if(mode.includes('sound')){try{primeRestAudio();let c=restAudioCtx;if(!c)return;let o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.28);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.3)}catch{}}}
async function syncWakeLock(){let should=!!S.settings.keepAwake&&hasMeaningfulActive()&&['strength','elliptical','yoga'].includes(S.view)&&document.visibilityState==='visible';if(should&&!wakeLock&&'wakeLock' in navigator){try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null},{once:true})}catch{wakeLock=null}}else if(!should&&wakeLock){try{await wakeLock.release()}catch{}wakeLock=null}}


function activitySessions(type){return S.sessions.filter(s=>s.type===type)}
function latestActivity(type){return activitySessions(type)[0]||null}
function ellipticalSummary(s){if(!s)return '';let parts=[durationText(s.duration)];if(s.resistance!=null)parts.push(`Resistance ${num(s.resistance)}`);if(s.distance!=null)parts.push(`${num(s.distance)} mi`);return parts.join(' · ')}
function yogaSummary(s){if(!s)return '';let parts=[durationText(s.duration)];if(s.title&&s.title!=='Yoga')parts.unshift(s.title);return parts.join(' · ')}
function activityLastLine(type){let last=latestActivity(type);if(!last)return `<div class="lasttime"><button class="historylink" onclick="PP.openActivityProgress('${type}')">History ›</button><b>No history yet</b></div>`;let summary=type==='elliptical'?ellipticalSummary(last):yogaSummary(last);return `<div class="lasttime"><button class="historylink" onclick="PP.openActivityProgress('${type}')">History ›</button><b>Last time</b> · ${esc(summary)}</div>`}
function openCardio(){clearEmptyActive();if(S.active&&S.active.type!=='elliptical'){modal={type:'activeConflict',target:'elliptical'};render();return}if(!S.active)S.active={id:uid('elliptical'),type:'elliptical',startedAt:Date.now(),timerStartedAt:null,timerAccum:0};go('elliptical')}
function ellipticalView(){let a=S.active?.type==='elliptical'?S.active:null;if(!a){S.active={id:uid('elliptical'),type:'elliptical',startedAt:Date.now(),timerStartedAt:null,timerAccum:0};a=S.active}let timed=currentTimedSeconds(a);return topbar(true)+sectionQuote('elliptical')+`${activityLastLine('elliptical')}<div class="card"><div class="row between"><div><span class="muted small">SESSION TIMER</span><div class="bigstat" id="ellTimer">${fmtSec(timed)}</div></div><button class="btn ${a.timerStartedAt?'secondary':''}" onclick="PP.toggleEllTimer()">${a.timerStartedAt?'Pause':'Start Timer'}</button></div></div>
 <div class="card"><div class="twocol desktop3"><div class="formfield"><label>Duration · minutes</label><input id="ellDuration" type="text" inputmode="decimal" value="${esc(a.duration??'')}" placeholder="37" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartActiveBeforeInput(event,'duration')" oninput="PP.smartActiveInput(this,'duration')"></div><div class="formfield"><label>Resistance</label><input id="ellResistance" type="text" inputmode="decimal" value="${esc(a.resistance??'')}" placeholder="8" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartActiveBeforeInput(event,'resistance')" oninput="PP.smartActiveInput(this,'resistance')"></div><div class="formfield"><label>Distance · miles</label><input id="ellDistance" type="text" inputmode="decimal" value="${esc(a.distance??'')}" placeholder="3.42" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartActiveBeforeInput(event,'distance')" oninput="PP.smartActiveInput(this,'distance')"></div><div class="formfield"><label>Calories</label><input id="ellCalories" type="text" inputmode="decimal" value="${esc(a.calories??'')}" placeholder="384" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartActiveBeforeInput(event,'calories')" oninput="PP.smartActiveInput(this,'calories')"></div></div><div class="formfield"><label>Notes</label><textarea id="ellNotes" placeholder="Optional" oninput="PP.setActiveField('notes',this.value)">${esc(a.notes||'')}</textarea></div><button class="btn block" onclick="PP.saveElliptical()">Save Elliptical Session</button><button class="btn ghost block" style="margin-top:8px" onclick="PP.discardActive()">Discard</button></div>`}
function currentTimedSeconds(a){return Math.floor((a.timerAccum||0)+(a.timerStartedAt?(Date.now()-a.timerStartedAt)/1000:0))}
function toggleEllTimer(){let a=S.active;if(a.type!=='elliptical')return;if(a.timerStartedAt){a.timerAccum=currentTimedSeconds(a);a.timerStartedAt=null}else a.timerStartedAt=Date.now();save();render();if(a.timerStartedAt)startSimpleTimer('ellTimer',a)}
function startSimpleTimer(id,a){clearInterval(ellipticalTimer);ellipticalTimer=setInterval(()=>{let el=document.getElementById(id);if(el)el.textContent=fmtSec(currentTimedSeconds(a));else clearInterval(ellipticalTimer)},1000)}
function saveElliptical(){let a=S.active;if(a?.type!=='elliptical')return;let timed=currentTimedSeconds(a),dur=valueOf('ellDuration');if((dur===''||Number(dur)===0)&&timed>0)dur=Math.round(timed/60*10)/10;if(dur===''||Number(dur)<=0){toast('Enter a duration or use the timer');return}let end=Date.now();S.sessions.unshift({id:a.id,type:'elliptical',startedAt:a.startedAt,endedAt:end,title:'Elliptical',duration:Number(dur),resistance:maybeNum('ellResistance'),distance:maybeNum('ellDistance'),calories:maybeNum('ellCalories'),notes:valueOf('ellNotes')});S.active=null;clearInterval(ellipticalTimer);S.view='history';render();toast('Elliptical session saved')}

function openYoga(){clearEmptyActive();if(S.active&&S.active.type!=='yoga'){modal={type:'activeConflict',target:'yoga'};render();return}if(!S.active)S.active={id:uid('yoga'),type:'yoga',startedAt:Date.now(),timerStartedAt:null,timerAccum:0};go('yoga')}
function yogaView(){let a=S.active?.type==='yoga'?S.active:null;if(!a){S.active={id:uid('yoga'),type:'yoga',startedAt:Date.now(),timerStartedAt:null,timerAccum:0};a=S.active}return topbar(true)+sectionQuote('yoga')+`${activityLastLine('yoga')}<div class="card"><div class="row between"><div><span class="muted small">PRACTICE TIMER</span><div class="bigstat" id="yogaTimer">${fmtSec(currentTimedSeconds(a))}</div></div><button class="btn ${a.timerStartedAt?'secondary':''}" onclick="PP.toggleYogaTimer()">${a.timerStartedAt?'Pause':'Start Timer'}</button></div></div><div class="card"><div class="formfield"><label>Duration · minutes</label><input id="yogaDuration" type="text" inputmode="decimal" value="${esc(a.duration??'')}" placeholder="30" onfocus="PP.armNumber(this)" onbeforeinput="PP.smartActiveBeforeInput(event,'duration')" oninput="PP.smartActiveInput(this,'duration')"></div><div class="formfield"><label>Name · optional</label><input id="yogaName" value="${esc(a.name||'')}" placeholder="Morning yoga" oninput="PP.setActiveField('name',this.value)"></div><div class="formfield"><label>Notes · optional</label><textarea id="yogaNotes" placeholder="Optional" oninput="PP.setActiveField('notes',this.value)">${esc(a.notes||'')}</textarea></div><button class="btn block" onclick="PP.saveYoga()">Save Yoga Session</button><button class="btn ghost block" style="margin-top:8px" onclick="PP.discardActive()">Discard</button></div>`}
function startYogaTicker(a){clearInterval(yogaTimer);yogaTimer=setInterval(()=>{let el=document.getElementById('yogaTimer');if(el)el.textContent=fmtSec(currentTimedSeconds(a));else clearInterval(yogaTimer)},1000)}
function toggleYogaTimer(){let a=S.active;if(a.type!=='yoga')return;if(a.timerStartedAt){a.timerAccum=currentTimedSeconds(a);a.timerStartedAt=null}else a.timerStartedAt=Date.now();save();render()}
function saveYoga(){let a=S.active;if(a?.type!=='yoga')return;let timed=currentTimedSeconds(a),dur=valueOf('yogaDuration');if((dur===''||Number(dur)===0)&&timed>0)dur=Math.round(timed/60*10)/10;if(dur===''||Number(dur)<=0){toast('Enter a duration or use the timer');return}let end=Date.now();S.sessions.unshift({id:a.id,type:'yoga',startedAt:a.startedAt,endedAt:end,title:valueOf('yogaName')||'Yoga',duration:Number(dur),notes:valueOf('yogaNotes')});S.active=null;clearInterval(yogaTimer);S.view='history';render();toast('Yoga session saved')}
function valueOf(id){return document.getElementById(id)?.value??''}function maybeNum(id){let v=valueOf(id);return v===''?null:Number(v)}function setActiveField(key,val,numeric=false){if(!S.active)return;S.active[key]=numeric?(val===''?'':Number(val)):val;save();if(S.settings.keepAwake)syncWakeLock()}

function activeConflictHTML(){let target=modal.target;return `<div class="sheetback"><div class="sheet"><div class="sheetgrab"></div><div class="eyebrow">Session already active</div><h3>Keep one routine at a time.</h3><p class="subtitle">You currently have ${esc(S.active?.type||'a session')} open. Finish or discard it before starting ${esc(target)}.</p><button class="btn block" onclick="PP.resumeActive()">Resume Current Session</button><button class="btn danger block" style="margin-top:8px" onclick="PP.discardAndStart('${esc(target)}')">Discard & Start ${esc(target)}</button><button class="btn ghost block" style="margin-top:8px" onclick="PP.closeModal()">Cancel</button></div></div>`}
function resumeActive(){let t=S.active?.type;modal=null;if(t==='strength')go('strength');else if(t==='elliptical')go('elliptical');else if(t==='yoga')go('yoga')}
function discardAndStart(target){S.active=null;modal=null;if(target==='strength')startStrength();else if(target==='elliptical')openCardio();else openYoga()}

function historyView(){return topbar()+`<h2>History</h2>${S.sessions.length?S.sessions.map(s=>sessionCard(s,false)).join(''):`<div class="card empty history-start"><h3>Nothing logged yet.</h3></div>`}`}
