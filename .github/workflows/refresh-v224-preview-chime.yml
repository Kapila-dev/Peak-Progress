name: Refresh v2.24 Preview Chime
on:
  push:
    branches: [main]
    paths: ['.preview-v224-chime-trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate warmer meditation chime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p preview-v224/audio
          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=261.63:duration=5.5:sample_rate=32000" \
            -f lavfi -i "sine=frequency=523.25:duration=5.5:sample_rate=32000" \
            -f lavfi -i "sine=frequency=784.88:duration=5.5:sample_rate=32000" \
            -f lavfi -i "sine=frequency=1046.50:duration=5.5:sample_rate=32000" \
            -filter_complex "[0:a]volume=0.34,afade=t=in:st=0:d=0.03,afade=t=out:st=0.18:d=5.25:curve=exp[a0];[1:a]volume=0.14,afade=t=in:st=0:d=0.02,afade=t=out:st=0.12:d=5.30:curve=exp[a1];[2:a]volume=0.045,afade=t=in:st=0:d=0.01,afade=t=out:st=0.08:d=4.80:curve=exp[a2];[3:a]volume=0.018,afade=t=in:st=0:d=0.01,afade=t=out:st=0.05:d=4.20:curve=exp[a3];[a0][a1][a2][a3]amix=inputs=4:normalize=0,lowpass=f=4200,alimiter=limit=0.62" \
            -ac 1 -ar 32000 -codec:a libmp3lame -b:a 72k preview-v224/audio/soft-chime.mp3
      - name: Bump preview cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-v224/sw.js')
          s=p.read_text()
          s=s.replace("const CACHE='peak-progress-v224-preview-1';","const CACHE='peak-progress-v224-preview-2';")
          p.write_text(s)
          PY
      - name: Validate and publish
        run: |
          set -euo pipefail
          test -s preview-v224/audio/soft-chime.mp3
          grep -q "peak-progress-v224-preview-2" preview-v224/sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .preview-v224-chime-trigger .github/workflows/refresh-v224-preview-chime.yml
          git add preview-v224/audio/soft-chime.mp3 preview-v224/sw.js
          git commit -m "Soften v2.24 preview meditation chime"
          git push origin HEAD:main
