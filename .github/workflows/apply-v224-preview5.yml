name: Apply v2.24 Preview 5
on:
  push:
    branches: [main]
    paths: ['.preview-v224-preview5-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          set -euo pipefail
          node .v224/patch-preview5.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('preview-v224/index.html').read_text()
          for m in ['Merge Existing Workout History',"const APP_VERSION='2.24-preview5'",'.modegrid .mode.meditationmode:after{border-color:rgba(143,24,43,.28)}','function mergeWorkoutHistory']:
              assert m in s,m
          js=re.search(r'<script>(.*)</script>',s,re.S); assert js
          Path('/tmp/app.js').write_text(js.group(1))
          PY
          node --check /tmp/app.js
          grep -q 'peak-progress-v224-preview-5' preview-v224/sw.js
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .preview-v224-preview5-trigger .github/workflows/apply-v224-preview5.yml .v224/patch-preview5.js
          git add preview-v224/index.html preview-v224/sw.js
          git commit -m "Add workout history merge and fix meditation accent"
          git push origin HEAD:main
