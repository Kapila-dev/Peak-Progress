name: Apply v2.24 Phase 1
on:
  push:
    branches: [v2.24-development]
    paths: ['.v224/apply-phase1']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.24-development
          fetch-depth: 0
      - name: Apply staged patch and verify
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .v224/phase1.patch.gz.b64 | gzip -d > /tmp/phase1.patch
          git apply --check /tmp/phase1.patch
          git apply /tmp/phase1.patch
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*)<\/script>/);
          if(!m) throw new Error('no script block');
          new Function(m[1]);
          if(!s.includes("const APP_VERSION='2.24-dev1'")) throw new Error('version marker missing');
          if(!s.includes('function trainingCoverage()')) throw new Error('coverage logic missing');
          if(!s.includes('secondaryMuscles')) throw new Error('secondary muscle model missing');
          console.log('v2.24 phase 1 syntax and markers OK');
          NODE
      - name: Commit phase 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .v224/phase1.patch.gz.b64 .v224/apply-phase1 .github/workflows/apply-v224-phase1.yml
          git add index.html
          git commit -m "Build v2.24 phase 1 training coverage"
          git push origin HEAD:v2.24-development
