name: Add v2.24 Preview Workout History Merge
on:
  push:
    branches: [main]
    paths: ['.preview-v224-history-merge-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch preview importer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-v224/index.html')
          s=p.read_text()
          old="""<button class=\"btn ghost block\" style=\"margin-top:8px\" onclick=\"document.getElementById('importFile').click()\">Import Backup</button><div class=\"subtleline\"></div><input class=\"hidden\" id=\"medCsvFile\" type=\"file\" accept=\"text/csv,.csv\" onchange=\"PP.prepareMeditationImport(this.files[0]);this.value=''\"> <button class=\"btn secondary block\" onclick=\"document.getElementById('medCsvFile').click()\">Import Meditation History CSV</button>"""
          new="""<button class=\"btn ghost block\" style=\"margin-top:8px\" onclick=\"document.getElementById('importFile').click()\">Import Backup</button><input class=\"hidden\" id=\"workoutHistoryFile\" type=\"file\" accept=\"application/json,.json\" onchange=\"PP.mergeWorkoutHistory(this.files[0]);this.value=''\"><button class=\"btn secondary block\" style=\"margin-top:8px\" onclick=\"document.getElementById('workoutHistoryFile').click()\">Merge Existing Workout History</button><p class=\"muted small backupnote\">Adds Strength, Elliptical and Yoga history from your existing Full Backup without replacing the Meditation history already imported into this preview.</p><div class=\"subtleline\"></div><input class=\"hidden\" id=\"medCsvFile\" type=\"file\" accept=\"text/csv,.csv\" onchange=\"PP.prepareMeditationImport(this.files[0]);this.value=''\"> <button class=\"btn secondary block\" onclick=\"document.getElementById('medCsvFile').click()\">Import Meditation History CSV</button>"""
          if old not in s: raise SystemExit('settings import marker missing')
          s=s.replace(old,new,1)
          marker="""async function resetApp(){if(!confirm('Reset ONLY the v2.24 preview data and preview photos on this device?'))return;"""
          fn="""
function workoutSessionKey(x){return String(x?.id||`${x?.type||''}|${x?.startedAt||''}|${x?.endedAt||''}|${x?.duration||''}`)}
async function mergeWorkoutHistory(file){
 if(!file)return;
 try{
  let j=JSON.parse(await file.text());
  if(!Array.isArray(j.sessions)||!Array.isArray(j.exercises))throw new Error();
  let incoming=j.sessions.filter(x=>x&&x.type!=='meditation');
  let existing=new Set(S.sessions.filter(x=>x&&x.type!=='meditation').map(workoutSessionKey));
  let added=incoming.filter(x=>!existing.has(workoutSessionKey(x)));
  S.sessions=[...S.sessions,...added];
  for(const e of j.exercises){
   if(!e||!e.id)continue;
   let cur=S.exercises.find(x=>x.id===e.id);
   if(!cur){S.exercises.push({...e});continue}
   if(e.custom){Object.assign(cur,{...e})}
   else{
    if(e.setupNote&&!cur.setupNote)cur.setupNote=e.setupNote;
    if(e.gym&&!cur.gym)cur.gym=e.gym;
   }
  }
  S.favoriteExerciseIds=[...new Set([...(S.favoriteExerciseIds||[]),...(Array.isArray(j.favoriteExerciseIds)?j.favoriteExerciseIds:[])])];
  if(j.photos&&typeof j.photos==='object'){
   for(const [id,dataUrl] of Object.entries(j.photos)){
    if(typeof dataUrl!=='string'||!dataUrl.startsWith('data:'))continue;
    try{await photoPut(id,dataURLToBlob(dataUrl))}catch{}
   }
   for(const u of Object.values(photoUrls))URL.revokeObjectURL(u);
   photoUrls={};photoPresence=new Map();
  }
  S=normalize(S);save();render();
  toast(`Merged ${added.length} workout session${added.length===1?'':'s'}`)
 }catch(e){toast('That workout backup could not be read')}
}
"""
          if marker not in s: raise SystemExit('reset marker missing')
          s=s.replace(marker,fn+marker,1)
          oldpp="prepareMeditationImport,commitMeditationImport,setting,exportData,importData,resetApp"
          newpp="prepareMeditationImport,commitMeditationImport,setting,exportData,importData,mergeWorkoutHistory,resetApp"
          if oldpp not in s: raise SystemExit('window PP marker missing')
          s=s.replace(oldpp,newpp,1)
          s=s.replace("const APP_VERSION='2.24-preview3';","const APP_VERSION='2.24-preview5';",1)
          p.write_text(s)
          PY
      - name: Bump preview cache and validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-v224/sw.js'); s=p.read_text(); s=s.replace("peak-progress-v224-preview-4","peak-progress-v224-preview-5"); p.write_text(s)
          import re
          html=Path('preview-v224/index.html').read_text()
          for m in ['Merge Existing Workout History','function mergeWorkoutHistory',"const APP_VERSION='2.24-preview5'",'mergeWorkoutHistory,resetApp']:
            assert m in html,m
          js=re.search(r'<script>(.*)</script>',html,re.S); assert js
          Path('/tmp/app.js').write_text(js.group(1))
          PY
          node --check /tmp/app.js
          grep -q "peak-progress-v224-preview-5" preview-v224/sw.js
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .preview-v224-history-merge-trigger .github/workflows/add-v224-workout-history-merge.yml
          git add preview-v224/index.html preview-v224/sw.js
          git commit -m "Add safe workout history merge to v2.24 preview"
          git push origin HEAD:main
