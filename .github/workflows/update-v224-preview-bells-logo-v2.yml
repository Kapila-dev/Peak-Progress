name: Update v2.24 Preview Bells and Logo v2
on:
  push:
    branches: [main]
    paths: ['.preview-v224-bells-logo-trigger2']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate bell choices
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          mkdir -p preview-v224/audio
          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=174.61:duration=7:sample_rate=32000" \
            -f lavfi -i "sine=frequency=349.23:duration=7:sample_rate=32000" \
            -f lavfi -i "sine=frequency=523.25:duration=7:sample_rate=32000" \
            -filter_complex "[0:a]volume=0.34,afade=t=in:st=0:d=0.05,afade=t=out:st=0.20:d=6.70:curve=exp[a0];[1:a]volume=0.10,afade=t=out:st=0.10:d=6.50:curve=exp[a1];[2:a]volume=0.025,afade=t=out:st=0.06:d=5.90:curve=exp[a2];[a0][a1][a2]amix=inputs=3:normalize=0,lowpass=f=2800,alimiter=limit=0.62" \
            -ac 1 -ar 32000 -codec:a libmp3lame -b:a 72k preview-v224/audio/deep-bell.mp3
          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=220:duration=8.5:sample_rate=32000" \
            -f lavfi -i "sine=frequency=222.4:duration=8.5:sample_rate=32000" \
            -f lavfi -i "sine=frequency=440:duration=8.5:sample_rate=32000" \
            -filter_complex "[0:a]volume=0.20,afade=t=in:st=0:d=0.05,afade=t=out:st=0.70:d=7.70:curve=exp[a0];[1:a]volume=0.15,afade=t=in:st=0:d=0.05,afade=t=out:st=0.70:d=7.70:curve=exp[a1];[2:a]volume=0.035,afade=t=out:st=0.35:d=7.30:curve=exp[a2];[a0][a1][a2]amix=inputs=3:normalize=0,lowpass=f=3600,alimiter=limit=0.58" \
            -ac 1 -ar 32000 -codec:a libmp3lame -b:a 72k preview-v224/audio/singing-bowl.mp3
      - name: Patch preview UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-v224/index.html'); s=p.read_text()
          old=""" if(type==='meditation')return `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="sigil-main" d="M30 8c-8 2-13 9-13 17 0 8 5 14 13 17-11 1-20-7-20-17S19 7 30 8Z"/><path class="sigil-main" d="M27 18c5 0 9 3 11 7M26 24c4 0 7 2 9 5M25 30c3 0 5 1 7 3"/><path class="sigil-accent" d="m36 12 1.4 2.6L40 16l-2.6 1.4L36 20l-1.4-2.6L32 16l2.6-1.4Z"/></svg>`;"""
          new=""" if(type==='meditation')return `<svg class="${cls}" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="sigil-main" d="M31 8c-8 2-13 9-13 16s5 14 13 16c-11 1-20-6-20-16S20 7 31 8Z"/><path class="sigil-accent" d="m35 21 3 3-3 3-3-3Z"/></svg>`;"""
          if old not in s: raise SystemExit('meditation logo marker missing')
          s=s.replace(old,new,1)
          old="meditation:{duration:15,soundscape:'rain',interval:5,ambienceVolume:58,bellVolume:72,startBell:true,finishBell:true}"
          new="meditation:{duration:15,soundscape:'rain',interval:5,ambienceVolume:58,bellVolume:72,bellTone:'soft',startBell:true,finishBell:true}"
          if old not in s: raise SystemExit('meditation defaults marker missing')
          s=s.replace(old,new,1)
          old="let meditationAudio=null; let meditationAudioKey=''; let meditationChime=null;"
          new="let meditationAudio=null; let meditationAudioKey=''; let meditationChime=null; let meditationChimeKey='';"
          if old not in s: raise SystemExit('meditation chime var marker missing')
          s=s.replace(old,new,1)
          marker="finishBell:m.finishBell!==false,nextIntervalAt:null"
          if s.count(marker)!=2: raise SystemExit(f'active meditation marker count {s.count(marker)}')
          s=s.replace(marker,"finishBell:m.finishBell!==false,bellTone:m.bellTone||'soft',nextIntervalAt:null")
          old='''</select></div></div><div class="formfield"><label>Soundscape volume'''
          new='''</select></div></div><div class="formfield"><label>Bell sound</label><div class="soundchips">${[['soft','Soft chime'],['deep','Deep bell'],['bowl','Singing bowl']].map(([v,l])=>`<button class="${(a.bellTone||'soft')===v?'active':''}" onclick="PP.setMeditationBellTone('${v}',true)">${l}</button>`).join('')}</div></div><div class="formfield"><label>Soundscape volume'''
          if s.count(old)!=1: raise SystemExit(f'bell UI marker count {s.count(old)}')
          s=s.replace(old,new,1)
          old="function setMeditationBells(on){let a=S.active;if(a?.type!=='meditation')return;a.startBell=!!on;a.finishBell=!!on;S.settings.meditation.startBell=!!on;S.settings.meditation.finishBell=!!on;save()}"
          new=old+"\nfunction setMeditationBellTone(v,preview=false){let a=S.active;if(a?.type!=='meditation')return;if(!['soft','deep','bowl'].includes(v))v='soft';a.bellTone=v;S.settings.meditation.bellTone=v;save();if(preview)playMeditationChime(a);render()}"
          if old not in s: raise SystemExit('setMeditationBells marker missing')
          s=s.replace(old,new,1)
          old="function playMeditationChime(a){if(!a)return;try{if(!meditationChime){meditationChime=new Audio('audio/soft-chime.mp3');meditationChime.preload='auto'}meditationChime.volume=Math.max(0,Math.min(1,(Number(a.bellVolume)||0)/100));meditationChime.currentTime=0;meditationChime.play().catch(()=>{})}catch{}}"
          new="function playMeditationChime(a){if(!a)return;try{let tones={soft:'soft-chime.mp3',deep:'deep-bell.mp3',bowl:'singing-bowl.mp3'},src=`audio/${tones[a.bellTone]||tones.soft}`;if(!meditationChime||meditationChimeKey!==src){if(meditationChime){try{meditationChime.pause()}catch{}}meditationChime=new Audio(src);meditationChime.preload='auto';meditationChimeKey=src}meditationChime.volume=Math.max(0,Math.min(1,(Number(a.bellVolume)||0)/100));meditationChime.currentTime=0;meditationChime.play().catch(()=>{})}catch{}}"
          if old not in s: raise SystemExit('playMeditationChime marker missing')
          s=s.replace(old,new,1)
          old="bellVolume:Number(a.bellVolume)||0,startBell:a.startBell!==false,finishBell:a.finishBell!==false"
          new="bellVolume:Number(a.bellVolume)||0,bellTone:a.bellTone||'soft',startBell:a.startBell!==false,finishBell:a.finishBell!==false"
          if old not in s: raise SystemExit('save meditation settings marker missing')
          s=s.replace(old,new,1)
          old="intervalMinutes:Number(a.intervalMinutes)||0,notes:String(a.notes||'')"
          new="intervalMinutes:Number(a.intervalMinutes)||0,bellTone:a.bellTone||'soft',notes:String(a.notes||'')"
          if old not in s: raise SystemExit('save meditation session marker missing')
          s=s.replace(old,new,1)
          old="setMeditationField,setMeditationBells,setMeditationVolume"
          new="setMeditationField,setMeditationBells,setMeditationBellTone,setMeditationVolume"
          if old not in s: raise SystemExit('PP export marker missing')
          s=s.replace(old,new,1)
          if "const APP_VERSION='2.24-preview';" in s:s=s.replace("const APP_VERSION='2.24-preview';","const APP_VERSION='2.24-preview3';",1)
          p.write_text(s)
          PY
      - name: Update preview offline cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preview-v224/sw.js'); s=p.read_text()
          s=s.replace("const CACHE='peak-progress-v224-preview-2';","const CACHE='peak-progress-v224-preview-3';")
          old="'./audio/soft-chime.mp3']"
          new="'./audio/soft-chime.mp3','./audio/deep-bell.mp3','./audio/singing-bowl.mp3']"
          if old not in s: raise SystemExit('service-worker audio marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate and publish
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('preview-v224/index.html').read_text()
          for m in ["bellTone:'soft'",'setMeditationBellTone','deep-bell.mp3','singing-bowl.mp3',"const APP_VERSION='2.24-preview3'",'M31 8c-8 2-13 9-13 16']:
            assert m in s,m
          js=re.search(r'<script>(.*)</script>',s,re.S); assert js
          Path('/tmp/app.js').write_text(js.group(1))
          for f in ['preview-v224/audio/soft-chime.mp3','preview-v224/audio/deep-bell.mp3','preview-v224/audio/singing-bowl.mp3']:
            assert Path(f).stat().st_size>1000,f
          sw=Path('preview-v224/sw.js').read_text(); assert 'peak-progress-v224-preview-3' in sw
          PY
          node --check /tmp/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .preview-v224-bells-logo-trigger .preview-v224-bells-logo-trigger2 .github/workflows/update-v224-preview-bells-logo.yml .github/workflows/update-v224-preview-bells-logo-v2.yml
          git add preview-v224/
          git commit -m "Add meditation bell choices and simplify preview icon"
          git push origin HEAD:main
