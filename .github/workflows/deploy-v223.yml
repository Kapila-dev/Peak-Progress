name: Deploy Peak Progress v2.23
on:
  push:
    paths:
      - '.deploy-v2.23/READY'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct production files
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy-v2.23/index-00.b64 .deploy-v2.23/index-01.b64 .deploy-v2.23/index-02.b64 .deploy-v2.23/index-03.b64 .deploy-v2.23/index-04.b64 .deploy-v2.23/index-05.b64 | base64 -d | gzip -d > index.html
          cp .deploy-v2.23/manifest.webmanifest manifest.webmanifest
          cp .deploy-v2.23/sw.js sw.js
          grep -q "const APP_VERSION='2.23'" index.html
          grep -q "peak-progress-v2-23" sw.js
      - name: Publish atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "Production files already current"
            exit 0
          fi
          git commit -m "Deploy Peak Progress 2.0 v2.23"
          git push origin HEAD:main
