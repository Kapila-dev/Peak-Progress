name: Promote Peak Progress v2.24 Production
on:
  push:
    branches: [main]
    paths: ['.promote-v224-production']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Promote tested preview to production root
        run: |
          set -euo pipefail
          cp preview-v224/index.html index.html
          mkdir -p audio
          cp preview-v224/audio/rain.mp3 audio/rain.mp3
          cp preview-v224/audio/ocean.mp3 audio/ocean.mp3
          cp preview-v224/audio/river-wind.mp3 audio/river-wind.mp3
          cp preview-v224/audio/soft-chime.mp3 audio/soft-chime.mp3
          cp preview-v224/audio/deep-bell.mp3 audio/deep-bell.mp3
          cp preview-v224/audio/singing-bowl.mp3 audio/singing-bowl.mp3
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps={
            '<title>Peak Progress 2.24 Preview</title>':'<title>Peak Progress</title>',
            '<meta name="apple-mobile-web-app-title" content="Peak Preview">':'<meta name="apple-mobile-web-app-title" content="Peak Progress">',
            'manifest.webmanifest?v=224preview1':'manifest.webmanifest?v=2241',
            'icon-192.png?v=224preview1':'icon-192.png?v=2241',
            "const KEY='peak_progress_v224_preview';":"const KEY='peak_progress_v2';",
            "const LEGACY='pp_v36_preview_disabled';":"const LEGACY='pp_v36';",
            "const DB='peak_progress_media_v224_preview';":"const DB='peak_progress_media';",
            "const APP_VERSION='2.24-preview6';":"const APP_VERSION='2.24';",
            "sessionStorage.getItem('pp_v224_preview_migration_notice')":"sessionStorage.getItem('pp_migration_notice')",
            "sessionStorage.removeItem('pp_v224_preview_migration_notice')":"sessionStorage.removeItem('pp_migration_notice')",
            "sessionStorage.setItem('pp_v224_preview_migration_notice'":"sessionStorage.setItem('pp_migration_notice'",
            "a.download='peak-progress-v224-preview-backup.json'":"a.download='peak-progress-full-backup.json'",
            "Reset ONLY the v2.24 preview data and preview photos on this device?":"Reset Peak Progress data and equipment photos on this device?",
            "toast('Preview data reset')":"toast('Peak Progress reset')"
          }
          for a,b in reps.items():
            if a not in s: raise SystemExit(f'missing production replacement marker: {a[:90]}')
            s=s.replace(a,b)
          # Remove preview-only top strip and its CSS.
          s=s.replace('<div class="previewstrip">v2.24 Safe Preview <span>· separate data</span></div>','',1)
          import re
          s=re.sub(r'\n\.previewstrip\{[^\n]*\}\.previewstrip span\{[^\n]*\}\n','\n',s,count=1)
          # Remove preview-only workout-history merge control; production already retains its own workout history.
          merge_ui=re.compile(r'<input class="hidden" id="workoutHistoryFile"[^>]*><button class="btn secondary block" style="margin-top:8px" onclick="document\.getElementById\(\'workoutHistoryFile\'\)\.click\(\)">Merge Existing Workout History</button><p class="muted small backupnote">Adds Strength, Elliptical and Yoga history from your existing Full Backup without replacing Meditation history already imported into this preview\.</p>')
          s,n=merge_ui.subn('',s,count=1)
          if n!=1: raise SystemExit('preview merge UI marker missing')
          p.write_text(s)
          PY
          cat > manifest.webmanifest <<'JSON'
          {
            "id":"./",
            "name":"Peak Progress",
            "short_name":"Peak Progress",
            "description":"Local-first strength, elliptical, yoga, and meditation tracker.",
            "start_url":"./",
            "scope":"./",
            "display":"standalone",
            "orientation":"portrait",
            "background_color":"#090708",
            "theme_color":"#090708",
            "icons":[
              {"src":"icon-192.png?v=2241","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"icon-512.png?v=2241","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          JSON
          cat > sw.js <<'JS'
          const CACHE='peak-progress-v224-1';
          const CORE=['./','./index.html','./manifest.webmanifest?v=2241','./icon-192.png?v=2241','./icon-512.png?v=2241','./audio/rain.mp3','./audio/ocean.mp3','./audio/river-wind.mp3','./audio/soft-chime.mp3','./audio/deep-bell.mp3','./audio/singing-bowl.mp3'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('peak-progress-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            if(e.request.method!=='GET')return;
            if(e.request.mode==='navigate'){
              e.respondWith(fetch(e.request).then(r=>{let copy=r.clone();caches.open(CACHE).then(c=>c.put('./index.html',copy));return r}).catch(()=>caches.match('./index.html')));
              return;
            }
            e.respondWith(caches.match(e.request).then(hit=>hit||fetch(e.request).then(r=>{let copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r})));
          });
          JS
      - name: Validate production build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text()
          required=["const KEY='peak_progress_v2'","const LEGACY='pp_v36'","const DB='peak_progress_media'","const APP_VERSION='2.24'",'function meditationView','let historyRange=\'week\'; let historyTypes=[]','toggleHistoryType','Training coverage','Singing bowl','Import Meditation History CSV']
          for x in required: assert x in s,x
          forbidden=['v2.24 Safe Preview','peak_progress_v224_preview','Merge Existing Workout History',"const APP_VERSION='2.24-preview6'"]
          for x in forbidden: assert x not in s,x
          js=re.search(r'<script>(.*)</script>',s,re.S); assert js
          Path('/tmp/app.js').write_text(js.group(1))
          man=json.loads(Path('manifest.webmanifest').read_text()); assert man['id']=='./' and man['start_url']=='./' and man['scope']=='./'
          for f in ['rain.mp3','ocean.mp3','river-wind.mp3','soft-chime.mp3','deep-bell.mp3','singing-bowl.mp3']:
            assert Path('audio',f).stat().st_size>1000,f
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Publish v2.24 production
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .promote-v224-production .github/workflows/promote-v224-production.yml
          git add index.html manifest.webmanifest sw.js audio/
          git commit -m "Release Peak Progress v2.24"
          git push origin HEAD:main
