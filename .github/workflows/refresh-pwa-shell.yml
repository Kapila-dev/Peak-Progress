name: Refresh Peak Progress PWA shell
on:
  push:
    paths:
      - '.shell-refresh-2231'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh manifest, icons and Android theme metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<link rel="manifest" href="manifest.webmanifest">','<link rel="manifest" href="manifest.webmanifest?v=2231">')
          s=s.replace('<link rel="icon" href="icon-192.png">','<link rel="icon" href="icon-192.png?v=2231">')
          s=s.replace('<link rel="apple-touch-icon" href="icon-192.png">','<link rel="apple-touch-icon" href="icon-192.png?v=2231">')
          p.write_text(s)
          PY
          cat > manifest.webmanifest <<'EOF'
          {
            "id": "./",
            "name": "Peak Progress",
            "short_name": "Peak",
            "description": "A simple strength, elliptical, and yoga tracker.",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#090708",
            "theme_color": "#090708",
            "icons": [
              {"src":"icon-192.png?v=2231","sizes":"192x192","type":"image/png","purpose":"any maskable"},
              {"src":"icon-512.png?v=2231","sizes":"512x512","type":"image/png","purpose":"any maskable"}
            ]
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const CACHE='peak-progress-v2-23';", "const CACHE='peak-progress-v2-23-shell1';")
          s=s.replace("const CORE=['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png'];", "const CORE=['./','./index.html','./manifest.webmanifest?v=2231','./icon-192.png?v=2231','./icon-512.png?v=2231'];")
          p.write_text(s)
          PY
      - name: Publish shell refresh and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refresh-pwa-shell.yml .shell-refresh-2231
          git add index.html manifest.webmanifest sw.js
          git commit -m "Refresh Peak Progress PWA shell metadata"
          git push origin HEAD:main
